modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "sablefix"
version = "1.6.1"
displayName = "Sable Fix Core"
description = """
Sable 存档自愈与诊断核心（诊断优先，修复为辅）。
v1.6.1：修复 v1.6.0 异步写盘回归——写盘快照改为类锁内深拷贝（原先在写线程无锁读非线程安全的 LinkedHashMap，与主线程 periodicWarn/onPlayerJoin 并发可致 CME 或半更新状态、撕裂数据）；snapshot() 同步深拷贝；新增停服 flush 屏障，等队列排空再退出，避免面板强杀/正常退出丢掉最后几次登记。
v1.6.0：优化——损伤登记簿写盘改为后台异步单线程队列，避免 synchronized 临界区内同步 IO 阻塞主线程；版本号同步到构建产物与顶栏。
v1.5.5：审计修复——面板扫描失败冷却标记不再 Long.MIN_VALUE 溢出（面板卡“一直扫描中”根因）；ticketCount 读取加 clamp 防护（损坏包不再踢客户端）；关于页版本号统一到构建版本源，与顶栏同步；en 文本联系方式改为 GitHub Issues。继续沿用 v1.5.4 P0 只读关服保护与启动兜底解锁。
卡死 20 秒自动抓全线程栈（原版 60 秒杀服前抢下现场）；
启动时体检 .slvlr/.slvls 指针与 force-load 票据；
支持子层级修复 / 批量修复 / 票据清理（自动备份，只读体检）；
/sablefix check|list|tickets|dump|repair|repair-all|tickets-purge|diag
/sfxpanel 打开中英双语图形面板。
"""
