modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "sablefix"
version = "1.6.5"
displayName = "Sable Fix Core"
description = """
Sable 存档自愈与诊断核心（诊断优先，修复为辅）。
v1.6.5：补齐 mod 依赖声明（NeoForge 21.1.x + MC 1.21.1，错误版本不再静默装载）；控制台日志每条恰好一行（删 6 处与 ModLog 重复的 LOGGER 行）；启动期事件（通道注册/保存观察者/登记清账/备份删除清理/只读解锁）统一走 ModLog，面板与报告不再漏看；`/sablefix diag` 标题行占位符漏传导致的裸 `%s` 修复；`/sablefix backup list` 路径冗余 `.\` 修复；清理 1 个死翻译 key。
v1.6.4：1.6.3 之后的 98 项修复——各世界存档状态隔离（扫描缓存/登记簿/日志/观察器随服务器重置）；备份绝不覆盖且数量如实上报；面板如实说明列表被截断（协议 v6→v10，新增备份/文件/日志总数）；体检、批量修复与启动扫描三入口同源，恢复健康的文件自动清账；诊断报告按世界命名、保留最近 20 份并汇总全部错误；面板命中区帧级回收、滚动偏移先 clamp 后使用、日志页真滚动条、矮窗口提示行不越界；写读两侧按 UTF-8 字节严格对齐。
v1.6.3：面板六轮对抗审计——修复早退帧（加载中/扫描中/卡片过矮）遗留命中区：清理按钮、日志滚动条、Telegram 横幅、体检页修复按钮在不可见时仍可点击，改为每帧按实际绘制结果重登记；滚动上限统一按当帧实测内容高回收，修掉窗口缩小后列表顶部滚成空白、About 页偏移被清零无法滚动、体检页备份清单压住只读提示、休息页偏移越界；若干文字截断与换行收口。
v1.6.2：/sablefix check 新增“已登记损伤”摘要并按类型给处置指引（STALE_READONLY→unmask，TICKETS_STUCK→tickets-purge，SUBLVL_DEAD→repair-all/fix）；periodicWarn 一行汇总按类型输出并带处置命令；onPlayerJoin 返回深拷贝，避免锁外读半更新 count（同源 1.6.0 写盘回归）；ModLog.add 锁内 LOGGER 改为异步输出（ModLog 审计残余 nit 收口）；继续沿用 v1.6.1 P0 只读关服保护与启动兜底解锁。
v1.6.1：修复 v1.6.0 异步写盘回归——写盘快照改为类锁内深拷贝（原先在写线程无锁读非线程安全的 LinkedHashMap，与主线程 periodicWarn/onPlayerJoin 并发可致 CME 或半更新状态、撕裂数据）；snapshot() 同步深拷贝；新增停服 flush 屏障，等队列排空再退出，避免面板强杀/正常退出丢掉最后几次登记。
v1.6.0：优化——损伤登记簿写盘改为后台异步单线程队列，避免 synchronized 临界区内同步 IO 阻塞主线程；版本号同步到构建产物与顶栏。
v1.5.5：审计修复——面板扫描失败冷却标记不再 Long.MIN_VALUE 溢出（面板卡“一直扫描中”根因）；ticketCount 读取加 clamp 防护（损坏包不再踢客户端）；关于页版本号统一到构建版本源，与顶栏同步；en 文本联系方式改为 GitHub Issues。继续沿用 v1.5.4 P0 只读关服保护与启动兜底解锁。
卡死 20 秒自动抓全线程栈（原版 60 秒杀服前抢下现场）；
启动时体检 .slvlr/.slvls 指针与 force-load 票据；
支持子层级修复 / 批量修复 / 票据清理（自动备份，只读体检）；
/sablefix check|list|tickets|dump|repair|repair-all|tickets-purge|diag
/sfxpanel 打开中英双语图形面板。
"""


# 依赖声明（十轮审计#75）：原本没有任何 [[dependencies]] 段 → 错误的 MC/NeoForge
# 版本上 mod 仍会被装载并可能崩溃，而不是给出「需要 1.21.1 / NeoForge 21.1.x」的清晰提示。
[[dependencies.sablefix]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sablefix]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"
