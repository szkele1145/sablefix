plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.5.2'
group = 'dev.sfx'

// 发布 jar 命名规范：模组名-模组版本号-游戏版本号-加载器.jar
// 如 sablefix-1.5.0-1.21.1-neoforge.jar（对齐社区惯例：create-1.21.1-6.0.10、sable-neoforge-1.21.1-2.0.6）
// 注：base.archivesName 会被 gradle 追加 "-${version}" 导致版本重复，故用 jar 任务重命名。
base {
    archivesName = 'sablefix'
}
tasks.named('jar') {
    archiveFileName = "sablefix-${project.version}-${project.minecraft_version}-neoforge.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // NFRT 引擎默认用"当前 JVM"跑反编译/重编译——launcher 若是 JRE（无 javac）会炸。
    // 用 Eclipse Compiler (ECJ) 替代 javac，摆脱对 launcher JDK 的依赖。
    neoFormRuntime {
        useEclipseCompiler = true
    }

    runs {
        client {
            client()
            // demo 开关（四轮审计#4：改名空间防第三方劫持；仅 dev 环境生效）：
            // -Dsablefix.demo=true（gradle 命令行）或环境变量 SABLEFIX_DEMO=1；
            // tab/窗口尺寸同理（sablefix.demo.tab / SFX_W / SFX_H）
            def demo = System.getProperty('sablefix.demo') != null || System.getenv('SABLEFIX_DEMO') != null
            if (demo) {
                systemProperty 'sablefix.demo', 'true'
                def tab = System.getProperty('sablefix.demo.tab') ?: System.getenv('SABLEFIX_DEMO_TAB')
                if (tab != null) systemProperty 'sablefix.demo.tab', tab
                def sc = System.getProperty('sablefix.scale') ?: System.getenv('SFX_SCALE')
                if (sc != null) systemProperty 'sablefix.scale', sc
                def w = System.getProperty('sfx.w') ?: System.getenv('SFX_W')
                def h = System.getProperty('sfx.h') ?: System.getenv('SFX_H')
                if (w != null) {
                    programArgument '--width'
                    programArgument w
                    programArgument '--height'
                    programArgument (h ?: '480')
                }
            }
        }
        server { server() }
    }

    mods {
        sablefix {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
