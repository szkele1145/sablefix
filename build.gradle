plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.4.1'
group = 'dev.sfx'

base {
    archivesName = 'sablefix'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // NFRT 引擎默认用"当前 JVM"跑反编译/重编译——launcher 若是 JRE（无 javac）会炸。
    // 用 Eclipse Compiler (ECJ) 替代 javac，摆脱对 launcher JDK 的依赖。
    neoFormRuntime {
        useEclipseCompiler = true
    }

    runs {
        client {
            client()
            // demo 开关：-Dsfx.demo=true（gradle 命令行）或环境变量 SFX_DEMO=1 均可触发；
            // tab/窗口尺寸同理（sfx.demo.tab / SFX_W / SFX_H）
            def demo = System.getProperty('sfx.demo') != null || System.getenv('SFX_DEMO') != null
            if (demo) {
                systemProperty 'sfx.demo', 'true'
                def tab = System.getProperty('sfx.demo.tab') ?: System.getenv('SFX_DEMO_TAB')
                if (tab != null) systemProperty 'sfx.demo.tab', tab
                def sc = System.getProperty('sfx.scale') ?: System.getenv('SFX_SCALE')
                if (sc != null) systemProperty 'sfx.scale', sc
                def w = System.getProperty('sfx.w') ?: System.getenv('SFX_W')
                def h = System.getProperty('sfx.h') ?: System.getenv('SFX_H')
                if (w != null) {
                    programArgument '--width'
                    programArgument w
                    programArgument '--height'
                    programArgument (h ?: '480')
                }
            }
        }
        server { server() }
    }

    mods {
        sablefix {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
